<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>自建球员 · NBA生涯模拟器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .app { width: 100%; max-width: 420px; background: #fff; border-radius: 28px; box-shadow: 0 12px 30px rgba(0,0,0,0.06); overflow: hidden; }
    .page { display: none; flex-direction: column; padding: 24px 20px; min-height: 620px; }
    .page.active { display: flex; }
    .title { font-size: 26px; font-weight: 900; color: #1a1a1a; text-align: center; letter-spacing: 2px; }
    .subtitle { font-size: 12px; color: #999; text-align: center; letter-spacing: 1px; margin-bottom: 20px; }
    .btn { padding: 14px; border-radius: 18px; font-weight: 800; font-size: 15px; letter-spacing: 1px; border: none; cursor: pointer; width: 100%; transition: 0.2s; }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: #ff5e3a; color: white; box-shadow: 0 6px 16px rgba(255,94,58,0.2); }
    .btn-primary:disabled { background: #ccc; box-shadow: none; }
    .btn-dark { background: #1a1a1a; color: white; margin-top: 10px; }
    .pos-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .pos-btn { padding: 12px; border-radius: 14px; font-weight: 700; font-size: 14px; border: 2px solid #eee; background: #fff; color: #333; text-align: center; cursor: pointer; }
    .pos-btn.selected { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .progress-text { font-size: 13px; font-weight: 700; color: #ff5e3a; text-align: center; margin-bottom: 12px; }
    .draw-card { background: #fafafa; border-radius: 20px; padding: 16px; border: 1px solid #eee; text-align: center; margin-bottom: 12px; }
    .jersey { width: 56px; height: 56px; border-radius: 50%; background: #1a1a1a; color: #fff; font-size: 24px; font-weight: 900; display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; }
    .player-name-card { font-size: 17px; font-weight: 800; }
    .player-pos-card { font-size: 11px; color: #888; font-weight: 600; margin-bottom: 10px; }
    .attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .attr-cell { background: #fff; padding: 10px 6px; border-radius: 12px; border: 1px solid #eee; cursor: pointer; text-align: center; }
    .attr-cell.picked { opacity: 0.4; pointer-events: none; background: #f5f5f5; }
    .attr-cell .al { font-size: 10px; color: #999; }
    .attr-cell .av { font-size: 20px; font-weight: 900; color: #1a1a1a; }
    .built-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; justify-content: center; }
    .chip { padding: 4px 9px; background: #eee; border-radius: 10px; font-size: 10px; font-weight: 700; color: #555; }
    .chip.filled { background: #1a1a1a; color: #fff; }
    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 100; justify-content: center; align-items: center; }
    .overlay.show { display: flex; }
    .modal { background: white; border-radius: 28px; padding: 24px 20px; width: 92%; max-width: 400px; max-height: 85vh; overflow-y: auto; text-align: center; animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes bounceIn { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .team-logo img { width: 64px; height: 64px; object-fit: contain; }
    .team-name { font-size: 20px; font-weight: 900; margin: 4px 0; }
    .draft-pick { font-size: 13px; color: #888; margin-bottom: 12px; }
    .rating-num { font-size: 56px; font-weight: 900; }
    .grade-tag { display: inline-block; padding: 4px 14px; border-radius: 16px; font-weight: 800; letter-spacing: 2px; font-size: 13px; margin-bottom: 16px; }
    .honor-section { background: #fafafa; border-radius: 16px; padding: 14px; margin: 12px 0; text-align: left; font-size: 12px; line-height: 1.8; }
    .honor-title { font-weight: 700; margin-bottom: 6px; font-size: 13px; }
    .honor-item { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
    .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 200; }
    .particle { position: absolute; border-radius: 50%; animation: fly 1s ease-out forwards; }
    @keyframes fly { 0% { opacity:1; transform: translate(0,0) scale(1); } 100% { opacity:0; transform: translate(var(--x), var(--y)) scale(0); } }
  </style>
</head>
<body>
<div class="app">
  <div class="page active" id="posPage">
    <div class="title">🏀 自建球员</div>
    <div class="subtitle">选择位置 · 抽取属性 · 模拟生涯</div>
    <div class="pos-grid" id="posGrid">
      <div class="pos-btn" data-pos="PG">控球后卫 PG</div>
      <div class="pos-btn" data-pos="SG">得分后卫 SG</div>
      <div class="pos-btn" data-pos="SF">小前锋 SF</div>
      <div class="pos-btn" data-pos="PF">大前锋 PF</div>
      <div class="pos-btn" data-pos="C">中锋 C</div>
    </div>
    <button class="btn btn-primary" id="confirmPosBtn" disabled>确认位置 · 开始游戏</button>
  </div>
  <div class="page" id="gamePage">
    <div class="progress-text" id="progressText">第 1/8 轮</div>
    <div class="draw-card" id="drawCard">
      <div class="jersey" id="currentJersey">??</div>
      <div class="player-name-card" id="currentName">等待抽取</div>
      <div class="player-pos-card" id="currentPos">--</div>
      <div class="attr-grid" id="attrGrid"></div>
    </div>
    <div class="built-chips" id="builtChips"></div>
    <button class="btn btn-primary" id="drawBtn">🎲 随机抽取球员</button>
  </div>
</div>
<div class="overlay" id="careerOverlay">
  <div class="modal">
    <div class="team-logo" id="teamLogo"></div>
    <div class="team-name" id="teamName">洛杉矶湖人</div>
    <div class="draft-pick" id="draftPick">首轮第1顺位</div>
    <div class="rating-num" id="finalRating">85</div>
    <div class="grade-tag" id="finalGrade">A级 · 全明星</div>
    <div class="honor-section" id="honorList"></div>
    <div style="font-size:11px; color:#aaa; margin-top:4px;" id="finalAttrs"></div>
    <button class="btn btn-dark" id="restartBtn">🔄 重新开始</button>
  </div>
</div>
<div class="particles" id="particlesContainer"></div>

<script>
(function() {
  const PLAYERS = [
    { name:"李丰晨", number:3,  pos:"PG", pts:15.2, reb:4.0, ast:8.5, stl:2.2, blk:0.1,
      buff:{stl:4, blk:2},
      fixed:{three:90, reb:66},
      min:{ast:90, blk:60} },
    { name:"孙英杰", number:8,  pos:"SG/C", pts:17.8, reb:5.0, ast:4.5, stl:1.3, blk:0.4,
      buff:{three:6, mid:6, ast:6, str:6, stl:6, blk:6, drib:6},
      fixed:{reb:90} },
    { name:"孙佳冠", number:5,  pos:"SF/SG", pts:23.5, reb:8.5, ast:2.0, stl:1.5, blk:1.5,
      buff:{stl:10},
      nerf:{three:15},
      fixed:{mid:98} },
    { name:"孙可豪", number:6,  pos:"PG", pts:8.2,  reb:2.0, ast:4.0, stl:1.0, blk:0.2,
      buff:{three:10, mid:10, reb:10, ast:10, str:10, stl:10, blk:10, drib:10} },
    { name:"李雨泽", number:12, pos:"C",  pts:11.0, reb:10.2,ast:0.8, stl:0.5, blk:2.0,
      fixed:{reb:85, three:25}, nerf:{blk:8} },
    { name:"贾祥磊", number:11, pos:"SG", pts:26.5, reb:5.2, ast:4.1, stl:1.9, blk:0.4,
      min:{three:70,mid:70,reb:70,ast:70,str:70,stl:70,drib:70},
      fixed:{drib:88, blk:79} },
    { name:"娄宇轩", number:17, pos:"SG", pts:14.5, reb:3.0, ast:2.5, stl:1.0, blk:0.1,
      buff:{str:30, blk:20, reb:10},
      fixed:{three:94} },
    { name:"冀嘉诚", number:13, pos:"PF", pts:9.5,  reb:7.0, ast:4.2, stl:1.0, blk:1.0 },
    { name:"张英智", number:7,  pos:"SF", pts:17.2, reb:5.0, ast:2.8, stl:1.6, blk:0.6,
      buff:{mid:15, reb:15, ast:15, str:15, stl:15, blk:15, drib:15},
      nerf:{three:14} },
    { name:"刘春光", number:0,  pos:"SG/PF", pts:21.0, reb:9.0, ast:4.5, stl:1.2, blk:1.6,
      buff:{reb:5, str:6, blk:6, stl:4}, nerf:{three:10, mid:8},
      fixed:{mid:85} }
  ];

  const ATTR_NAMES = ["三分","中投","篮板","助攻","力量","抢断","盖帽","运球"];
  const ATTR_KEYS  = ["three","mid","reb","ast","str","stl","blk","drib"];

  const NBA_TEAMS = [
    "亚特兰大老鹰<img src='hawks.png' style='width:64px;height:64px;object-fit:contain;'>",
    "波士顿凯尔特人<img src='celtics.png' style='width:64px;height:64px;object-fit:contain;'>",
    "布鲁克林篮网<img src='nets.png' style='width:64px;height:64px;object-fit:contain;'>",
    "夏洛特黄蜂<img src='hornets.png' style='width:64px;height:64px;object-fit:contain;'>",
    "芝加哥公牛<img src='bulls.png' style='width:64px;height:64px;object-fit:contain;'>",
    "克利夫兰骑士<img src='cavaliers.png' style='width:64px;height:64px;object-fit:contain;'>",
    "达拉斯独行侠<img src='mavericks.png' style='width:64px;height:64px;object-fit:contain;'>",
    "丹佛掘金<img src='nuggets.png' style='width:64px;height:64px;object-fit:contain;'>",
    "底特律活塞<img src='pistons.png' style='width:64px;height:64px;object-fit:contain;'>",
    "金州勇士<img src='warriors.png' style='width:64px;height:64px;object-fit:contain;'>",
    "休斯顿火箭<img src='rockets.png' style='width:64px;height:64px;object-fit:contain;'>",
    "印第安纳步行者<img src='pacers.png' style='width:64px;height:64px;object-fit:contain;'>",
    "洛杉矶快船<img src='clippers.png' style='width:64px;height:64px;object-fit:contain;'>",
    "洛杉矶湖人<img src='lakers.png' style='width:64px;height:64px;object-fit:contain;'>",
    "孟菲斯灰熊<img src='grizzlies.png' style='width:64px;height:64px;object-fit:contain;'>",
    "迈阿密热火<img src='heat.png' style='width:64px;height:64px;object-fit:contain;'>",
    "密尔沃基雄鹿<img src='bucks.png' style='width:64px;height:64px;object-fit:contain;'>",
    "明尼苏达森林狼<img src='timberwolves.png' style='width:64px;height:64px;object-fit:contain;'>",
    "新奥尔良鹈鹕<img src='pelicans.png' style='width:64px;height:64px;object-fit:contain;'>",
    "纽约尼克斯<img src='knicks.png' style='width:64px;height:64px;object-fit:contain;'>",
    "俄克拉荷马雷霆<img src='thunder.png' style='width:64px;height:64px;object-fit:contain;'>",
    "奥兰多魔术<img src='magic.png' style='width:64px;height:64px;object-fit:contain;'>",
    "费城76人<img src='sixers.png' style='width:64px;height:64px;object-fit:contain;'>",
    "菲尼克斯太阳<img src='suns.png' style='width:64px;height:64px;object-fit:contain;'>",
    "波特兰开拓者<img src='blazers.png' style='width:64px;height:64px;object-fit:contain;'>",
    "萨克拉门托国王<img src='kings.png' style='width:64px;height:64px;object-fit:contain;'>",
    "圣安东尼奥马刺<img src='spurs.png' style='width:64px;height:64px;object-fit:contain;'>",
    "多伦多猛龙<img src='raptors.png' style='width:64px;height:64px;object-fit:contain;'>",
    "犹他爵士<img src='jazz.png' style='width:64px;height:64px;object-fit:contain;'>",
    "华盛顿奇才<img src='wizards.png' style='width:64px;height:64px;object-fit:contain;'>"
  ];

  let state = {
    pos: null, gamePlayers: [], weights: [], currentDrawn: null,
    builtAttrs: {}, remainingKeys: [...ATTR_KEYS], round: 0, finished: false
  };

  function generateAttrs(p) {
    let three = Math.round((p.pts/18)*58 + (p.ast/8)*18 + 14);
    let mid   = Math.round((p.pts/18)*60 + 16);
    let reb   = Math.round((p.reb/10)*55 + 22);
    let ast   = Math.round((p.ast/8)*58 + 18);
    let str   = Math.round((p.reb/10)*38 + (p.blk/2)*28 + 24);
    let stl   = Math.round((p.stl/2)*55 + 22);
    let blk   = Math.round((p.blk/2)*55 + 22);
    let drib  = Math.round((p.ast/8)*45 + (p.stl/2)*26 + 20);

    if (p.buff) {
      if (p.buff.three) three += p.buff.three;
      if (p.buff.mid) mid += p.buff.mid;
      if (p.buff.reb) reb += p.buff.reb;
      if (p.buff.ast) ast += p.buff.ast;
      if (p.buff.str) str += p.buff.str;
      if (p.buff.stl) stl += p.buff.stl;
      if (p.buff.blk) blk += p.buff.blk;
      if (p.buff.drib) drib += p.buff.drib;
    }
    if (p.nerf) {
      if (p.nerf.three) three -= p.nerf.three;
      if (p.nerf.mid) mid -= p.nerf.mid;
      if (p.nerf.reb) reb -= p.nerf.reb;
      if (p.nerf.ast) ast -= p.nerf.ast;
      if (p.nerf.str) str -= p.nerf.str;
      if (p.nerf.stl) stl -= p.nerf.stl;
      if (p.nerf.blk) blk -= p.nerf.blk;
      if (p.nerf.drib) drib -= p.nerf.drib;
    }

    let attrs = { three, mid, reb, ast, str, stl, blk, drib };

    if (p.fixed) {
      if (p.fixed.three !== undefined) attrs.three = p.fixed.three;
      if (p.fixed.mid !== undefined) attrs.mid = p.fixed.mid;
      if (p.fixed.reb !== undefined) attrs.reb = p.fixed.reb;
      if (p.fixed.ast !== undefined) attrs.ast = p.fixed.ast;
      if (p.fixed.str !== undefined) attrs.str = p.fixed.str;
      if (p.fixed.stl !== undefined) attrs.stl = p.fixed.stl;
      if (p.fixed.blk !== undefined) attrs.blk = p.fixed.blk;
      if (p.fixed.drib !== undefined) attrs.drib = p.fixed.drib;
    }

    const defaultMin = 45;
    for (let key in attrs) {
      let minVal = defaultMin;
      if (p.min && p.min[key] !== undefined) minVal = p.min[key];
      attrs[key] = Math.max(minVal, Math.min(98, attrs[key]));
    }
    return attrs;
  }

  function initGame() {
    state.gamePlayers = PLAYERS.map(p => ({ ...p, _attrs: generateAttrs(p) }));
    state.weights = state.gamePlayers.map(() => 1.0);
    state.builtAttrs = {}; state.remainingKeys = [...ATTR_KEYS];
    state.round = 0; state.finished = false; state.currentDrawn = null;
  }

  function drawPlayer() {
    const total = state.weights.reduce((a,b)=>a+b,0);
    let r = Math.random()*total;
    for(let i=0;i<state.gamePlayers.length;i++){
      r -= state.weights[i];
      if(r<=0){
        state.weights[i] *= 0.15;
        return state.gamePlayers[i];
      }
    }
    return state.gamePlayers[state.gamePlayers.length-1];
  }

  function calcOverall() {
    const w = {three:0.15,mid:0.12,reb:0.12,ast:0.15,str:0.10,stl:0.12,blk:0.08,drib:0.16};
    let s=0; for(let k in state.builtAttrs) s+=state.builtAttrs[k].value*(w[k]||0.1);
    return Math.round(s);
  }

  function getGrade(val) {
    if(val>=90) return {grade:'S',desc:'超级巨星',color:'#ff3b3b'};
    if(val>=80) return {grade:'A',desc:'全明星',color:'#ff7b3b'};
    if(val>=60) return {grade:'B',desc:'角色球员',color:'#f0a020'};
    return {grade:'C',desc:'饮水机球员',color:'#5b9bd5'};
  }

  function getDraftPick(overall) {
    if(overall>=95) return '🏅 状元签';
    if(overall>=90) return '首轮第'+(1+Math.floor(Math.random()*3))+'顺位';
    if(overall>=85) return '首轮第'+(4+Math.floor(Math.random()*5))+'顺位';
    if(overall>=80) return '首轮第'+(9+Math.floor(Math.random()*6))+'顺位';
    if(overall>=75) return '首轮第'+(15+Math.floor(Math.random()*10))+'顺位';
    if(overall>=70) return '次轮第'+(1+Math.floor(Math.random()*10))+'顺位';
    if(overall>=65) return '次轮第'+(11+Math.floor(Math.random()*15))+'顺位';
    return '落选秀';
  }

  function generateHonors(overall) {
    const honors = [];
    if(overall>=95){
      honors.push('🏆 总冠军 (3次)','🏅 常规赛MVP (2次)','🏅 总决赛MVP (2次)','⭐ 全明星 (8次)','📊 最佳阵容一阵 (5次)','🛡️ 最佳防守阵容 (2次)');
    }else if(overall>=90){
      honors.push('🏆 总冠军 (1次)','🏅 常规赛MVP (1次)','⭐ 全明星 (6次)','📊 最佳阵容一阵 (2次)','📊 最佳阵容二阵 (2次)');
    }else if(overall>=85){
      honors.push('⭐ 全明星 (4次)','📊 最佳阵容二阵 (2次)','📊 最佳阵容三阵 (1次)','🛡️ 最佳防守阵容 (1次)');
    }else if(overall>=80){
      honors.push('⭐ 全明星 (2次)','📊 最佳阵容三阵 (1次)','🏀 最佳第六人 (1次)');
    }else if(overall>=75){
      honors.push('⭐ 全明星 (1次)','📋 周最佳球员 (3次)','🏀 进步最快球员 (1次)');
    }else if(overall>=70){
      honors.push('📋 周最佳球员 (1次)','🔄 稳定轮换球员');
    }else if(overall>=65){
      honors.push('🔄 角色球员','📋 双向合同');
    }else{
      honors.push('🔄 辗转多队','📋 短合同球员');
    }
    if(overall>=80 && Math.random()>0.6) honors.push('🎯 三分大赛冠军');
    if(overall>=75 && Math.random()>0.7) honors.push('🏅 扣篮大赛冠军');
    if(Math.random()>0.85) honors.push('🌟 最佳队友奖');
    return honors;
  }

  function renderGame() {
    document.getElementById('progressText').textContent = state.finished?'✅ 抽取完成！':`第 ${state.round+1}/8 轮`;
    let chipsHtml='';
    ATTR_KEYS.forEach((k,i)=>{
      const d=state.builtAttrs[k];
      chipsHtml+=d?`<span class="chip filled">${ATTR_NAMES[i]}:${d.value}</span>`:`<span class="chip">${ATTR_NAMES[i]}:?</span>`;
    });
    document.getElementById('builtChips').innerHTML=chipsHtml;

    if(state.currentDrawn && !state.finished){
      document.getElementById('currentJersey').textContent=state.currentDrawn.number;
      document.getElementById('currentName').textContent=state.currentDrawn.name;
      document.getElementById('currentPos').textContent=state.currentDrawn.pos;
      let gridHtml='';
      ATTR_KEYS.forEach((k,i)=>{
        const v=state.currentDrawn._attrs[k];
        const picked=state.builtAttrs.hasOwnProperty(k);
        gridHtml+=`<div class="attr-cell ${picked?'picked':''}" data-key="${k}"><div class="al">${ATTR_NAMES[i]}</div><div class="av">${v}</div></div>`;
      });
      document.getElementById('attrGrid').innerHTML=gridHtml;
      document.querySelectorAll('.attr-cell:not(.picked)').forEach(c=>c.addEventListener('click',()=>pickAttr(c.dataset.key)));
      document.getElementById('drawBtn').textContent='👆 选择属性';
      document.getElementById('drawBtn').disabled=true;
    }else if(state.finished){
      document.getElementById('currentJersey').textContent='🏆';
      document.getElementById('currentName').textContent='生涯生成中...';
      document.getElementById('currentPos').textContent='--';
      document.getElementById('attrGrid').innerHTML='';
      document.getElementById('drawBtn').textContent='已完成';
      document.getElementById('drawBtn').disabled=true;
    }else{
      document.getElementById('currentJersey').textContent='??';
      document.getElementById('currentName').textContent='等待抽取';
      document.getElementById('currentPos').textContent='--';
      document.getElementById('attrGrid').innerHTML='';
      document.getElementById('drawBtn').textContent='🎲 随机抽取球员';
      document.getElementById('drawBtn').disabled=false;
    }
  }

  function pickAttr(key){
    if(!state.currentDrawn||state.builtAttrs[key]||!state.remainingKeys.includes(key)) return;
    state.builtAttrs[key]={value:state.currentDrawn._attrs[key],source:state.currentDrawn.name};
    state.remainingKeys=state.remainingKeys.filter(k=>k!==key);
    state.round++; state.currentDrawn=null;
    if(state.remainingKeys.length===0){ state.finished=true; renderGame(); setTimeout(showCareer,500); }
    else renderGame();
  }

  function showCareer(){
    const overall=calcOverall();
    const {grade,desc,color}=getGrade(overall);
    const teamStr=NBA_TEAMS[Math.floor(Math.random()*NBA_TEAMS.length)];
    const pick=getDraftPick(overall);
    const honors=generateHonors(overall);

    // 提取队名和图片：队名在<img>之前，图片是<img...>部分
    const imgStart=teamStr.indexOf('<img');
    const teamName=teamStr.substring(0,imgStart);
    const imgTag=teamStr.substring(imgStart);

    document.getElementById('teamLogo').innerHTML=imgTag;
    document.getElementById('teamName').textContent=teamName;
    document.getElementById('draftPick').textContent=pick;
    document.getElementById('finalRating').textContent=overall;
    document.getElementById('finalRating').style.color=color;
    document.getElementById('finalGrade').textContent=grade+'级 · '+desc;
    document.getElementById('finalGrade').style.background=color;
    document.getElementById('finalGrade').style.color='#fff';

    let honorHtml='<div class="honor-title">🏅 生涯荣誉</div>';
    honors.forEach(h=>{ honorHtml+=`<div class="honor-item">${h}</div>`; });
    document.getElementById('honorList').innerHTML=honorHtml;

    let attrStr='';
    ATTR_KEYS.forEach((k,i)=>{ attrStr+=`${ATTR_NAMES[i]}:${state.builtAttrs[k].value} `; });
    document.getElementById('finalAttrs').textContent=attrStr;
    document.getElementById('careerOverlay').classList.add('show');
    spawnParticles();
  }

  function spawnParticles(){
    const container=document.getElementById('particlesContainer');
    for(let i=0;i<20;i++){
      const p=document.createElement('div'); p.className='particle';
      p.style.left='50%'; p.style.top='50%';
      p.style.setProperty('--x',(Math.random()-0.5)*200+'px');
      p.style.setProperty('--y',(Math.random()-0.5)*200+'px');
      p.style.background=['#ff5e3a','#ffd93d','#3b8beb'][Math.floor(Math.random()*3)];
      p.style.width=(6+Math.random()*8)+'px'; p.style.height=p.style.width;
      container.appendChild(p); setTimeout(()=>p.remove(),1000);
    }
  }

  function restart(){
    document.getElementById('careerOverlay').classList.remove('show');
    document.getElementById('gamePage').classList.remove('active');
    document.getElementById('posPage').classList.add('active');
    document.getElementById('confirmPosBtn').disabled=true;
    document.querySelectorAll('.pos-btn').forEach(b=>b.classList.remove('selected'));
    state.pos=null;
  }

  document.querySelectorAll('.pos-btn').forEach(btn=>{
    btn.addEventListener('click',function(){
      document.querySelectorAll('.pos-btn').forEach(b=>b.classList.remove('selected'));
      this.classList.add('selected');
      state.pos=this.dataset.pos;
      document.getElementById('confirmPosBtn').disabled=false;
    });
  });

  document.getElementById('confirmPosBtn').addEventListener('click',()=>{
    if(!state.pos) return;
    initGame();
    document.getElementById('posPage').classList.remove('active');
    document.getElementById('gamePage').classList.add('active');
    renderGame();
  });

  document.getElementById('drawBtn').addEventListener('click',()=>{
    if(state.finished||state.currentDrawn) return;
    state.currentDrawn=drawPlayer();
    renderGame();
  });

  document.getElementById('restartBtn').addEventListener('click',restart);
})();
</script>
</body>
</html>
