<html lang="zh-CN">

  <title>自建球员 · NBA生涯模拟器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {

      min-height: 100vh;

      justify-content: center;
      align-items: center;
      padding: 12px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

    .page.active { display: flex; }
    .title { font-size: 26px; font-weight: 900; color: #1a1a1a; text-align: center; letter-spacing: 2px; }
    .subtitle { font-size: 12px; color: #999; text-align: center; letter-spacing: 1px; margin-bottom: 20px; }
    .btn { padding: 14px; border-radius: 18px; font-weight: 800; font-size: 15px; letter-spacing: 1px; border: none; cursor: pointer; width: 100%; transition: 0.2s; }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: #ff5e3a; color: white; box-shadow: 0 6px 16px rgba(255,94,58,0.2); }
    .btn-primary:disabled { background: #ccc; box-shadow: none; }
    .btn-dark { background: #1a1a1a; color: white; margin-top: 10px; }
    .btn-blue { background: #3b8beb; color: white; margin-top: 10px; }
    .btn-outline { background: #fff; color: #ff5e3a; border: 2px solid #ff5e3a; margin-top: 8px; font-size: 13px; padding: 10px; font-weight: 700; }
    .btn-outline:disabled { border-color: #ccc; color: #ccc; background: #f5f5f5; }
    .pos-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .pos-btn { padding: 12px; border-radius: 14px; font-weight: 700; font-size: 14px; border: 2px solid #eee; background: #fff; color: #333; text-align: center; cursor: pointer; }
    .pos-btn.selected { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .progress-text { font-size: 13px; font-weight: 700; color: #ff5e3a; text-align: center; margin-bottom: 4px; }
    .reroll-info { font-size: 11px; color: #999; text-align: center; margin-bottom: 10px; }
    .reroll-info span { color: #ff5e3a; font-weight: 700; }
    .draw-card { background: #fafafa; border-radius: 20px; padding: 16px; border: 1px solid #eee; text-align: center; margin-bottom: 12px; }
    .jersey { width: 56px; height: 56px; border-radius: 50%; background: #1a1a1a; color: #fff; font-size: 24px; font-weight: 900; display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; }
    .player-name-card { font-size: 17px; font-weight: 800; }
    .player-pos-card { font-size: 11px; color: #888; font-weight: 600; margin-bottom: 10px; }
    .attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .attr-cell { background: #fff; padding: 10px 6px; border-radius: 12px; border: 1px solid #eee; cursor: pointer; text-align: center; }
    .attr-cell.picked { opacity: 0.4; pointer-events: none; background: #f5f5f5; }
    .attr-cell .al { font-size: 10px; color: #999; }
    .attr-cell .av { font-size: 20px; font-weight: 900; color: #1a1a1a; }
    .built-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; justify-content: center; }
    .chip { padding: 4px 9px; background: #eee; border-radius: 10px; font-size: 10px; font-weight: 700; color: #555; }
    .chip.filled { background: #1a1a1a; color: #fff; }
    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 100; justify-content: center; align-items: center; }
    .overlay.show { display: flex; }
    .modal { background: white; border-radius: 28px; padding: 24px 20px; width: 92%; max-width: 400px; max-height: 85vh; overflow-y: auto; text-align: center; animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes bounceIn { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .team-logo img { width: 64px; height: 64px; object-fit: contain; }
    .team-name { font-size: 20px; font-weight: 900; margin: 4px 0; }
    .draft-pick { font-size: 13px; color: #888; margin-bottom: 12px; }
    .rating-num { font-size: 72px; font-weight: 900; line-height: 1; margin: 8px 0; animation: ratingGlow 1.5s ease-in-out infinite alternate; }
    @keyframes ratingGlow { 0% { text-shadow: 0 0 20px rgba(255,94,58,0.3); transform: scale(1); } 100% { text-shadow: 0 0 50px rgba(255,94,58,0.7); transform: scale(1.05); } }
    .grade-tag { display: inline-block; padding: 6px 18px; border-radius: 16px; font-weight: 800; letter-spacing: 2px; font-size: 14px; margin-bottom: 16px; }
    .honor-section { background: #fafafa; border-radius: 16px; padding: 14px; margin: 12px 0; text-align: left; font-size: 12px; line-height: 1.8; }
    .honor-title { font-weight: 700; margin-bottom: 6px; font-size: 13px; }
    .honor-item { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
    .attr-source-list { text-align: left; margin: 12px 0; }
    .attr-source-item { display: flex; justify-content: space-between; font-size: 11px; padding: 3px 0; border-bottom: 1px solid #f0f0f0; color: #aaa; }
    .attr-source-item span:last-child { color: #999; font-weight: 600; }
    .pos-display { font-size: 18px; font-weight: 700; color: #555; letter-spacing: 1px; margin-bottom: 2px; }
    .pos-display small { font-size: 13px; color: #999; }
    .vs-display { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 12px 0; }
    .vs-player { text-align: center; flex: 1; }
    .vs-score { font-size: 48px; font-weight: 900; }
    .vs-name { font-size: 14px; font-weight: 700; color: #555; }
    .vs-tag { font-size: 20px; font-weight: 900; color: #ccc; }
    .vs-winner { font-size: 16px; font-weight: 800; padding: 6px 14px; border-radius: 12px; display: inline-block; }
    .copy-input { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid #eee; font-size: 11px; text-align: center; margin: 8px 0; }
    .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 200; }
    .particle { position: absolute; border-radius: 50%; animation: fly 1s ease-out forwards; }
    @keyframes fly { 0% { opacity:1; transform: translate(0,0) scale(1); } 100% { opacity:0; transform: translate(var(--x), var(--y)) scale(0); } }
    .btn-draft { background: #1a1a1a; color: #fff; margin-top: 12px; }
    .nba-comp { background: #fafafa; border-radius: 14px; padding: 10px; margin: 8px 0; font-size: 12px; }
    .nba-comp strong { color: #ff5e3a; }
    .career-stats { display: grid; grid-template-columns: repeat(5,1fr); gap: 4px; margin: 8px 0; }
    .career-stat { background: #f5f5f5; border-radius: 10px; padding: 8px 4px; text-align: center; }
    .career-stat .cs-val { font-size: 18px; font-weight: 900; color: #1a1a1a; }
    .career-stat .cs-label { font-size: 9px; color: #999; }
    .mode-select { display: flex; gap: 12px; margin-bottom: 24px; }
    .mode-card { flex: 1; background: #fafafa; border: 2px solid #eee; border-radius: 20px; padding: 20px 12px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .mode-card.selected { border-color: #ff5e3a; background: #fffaf8; }
    .mode-card .mode-icon { font-size: 36px; margin-bottom: 8px; }
    .mode-card .mode-label { font-weight: 800; font-size: 15px; color: #1a1a1a; }
    .mode-card .mode-desc { font-size: 11px; color: #999; margin-top: 4px; }
    .invite-info { font-size: 13px; color: #3b8beb; font-weight: 700; margin-bottom: 8px; }
    .waiting-text { font-size: 12px; color: #aaa; }

</head>

  ];

  let gameMode = 'solo';
  let opponentData = null;
  let state = {
    pos: null, gamePlayers: [], weights: [], currentDrawn: null,
    builtAttrs: {}, remainingKeys: [...ATTR_KEYS], round: 0, finished: false,
    rerollsLeft: 3
  };

  function generateAttrs(p) {
    let three = Math.round((p.pts/18)*58 + (p.ast/8)*18 + 14);
    let mid   = Math.round((p.pts/18)*60 + 16);
    let reb   = Math.round((p.reb/10)*55 + 22);
    let ast   = Math.round((p.ast/8)*58 + 18);
    let str   = Math.round((p.reb/10)*38 + (p.blk/2)*28 + 24);
    let stl   = Math.round((p.stl/2)*55 + 22);
    let blk   = Math.round((p.blk/2)*55 + 22);
    let drib  = Math.round((p.ast/8)*45 + (p.stl/2)*26 + 20);
    if (p.buff) {
      if (p.buff.three) three += p.buff.three;
      if (p.buff.mid) mid += p.buff.mid;
      if (p.buff.reb) reb += p.buff.reb;
      if (p.buff.ast) ast += p.buff.ast;
      if (p.buff.str) str += p.buff.str;
      if (p.buff.stl) stl += p.buff.stl;
      if (p.buff.blk) blk += p.buff.blk;
      if (p.buff.drib) drib += p.buff.drib;
    }
    if (p.nerf) {
      if (p.nerf.three) three -= p.nerf.three;
      if (p.nerf.mid) mid -= p.nerf.mid;
      if (p.nerf.reb) reb -= p.nerf.reb;
      if (p.nerf.ast) ast -= p.nerf.ast;
      if (p.nerf.str) str -= p.nerf.str;
      if (p.nerf.stl) stl -= p.nerf.stl;
      if (p.nerf.blk) blk -= p.nerf.blk;
      if (p.nerf.drib) drib -= p.nerf.drib;
    }
    let attrs = { three, mid, reb, ast, str, stl, blk, drib };
    if (p.fixed) {
      for (let k in p.fixed) {
        if (p.fixed[k] !== undefined) attrs[k] = p.fixed[k];
      }
    }
    const defaultMin = 45;
    for (let k in attrs) {
      let minVal = defaultMin;
      if (p.min && p.min[k] !== undefined) minVal = p.min[k];
      attrs[k] = Math.max(minVal, Math.min(98, attrs[k]));
    }
    return attrs;
  }

  function initGame() {
    state.gamePlayers = PLAYERS.map(p => ({ ...p, _attrs: generateAttrs(p) }));
    state.weights = state.gamePlayers.map(() => 1.0);
    state.builtAttrs = {};
    state.remainingKeys = [...ATTR_KEYS];
    state.round = 0; state.finished = false; state.currentDrawn = null;
    state.rerollsLeft = 3;
  }

  function drawPlayer() {
    const total = state.weights.reduce((a,b)=>a+b,0);
    let r = Math.random()*total;
    for(let i=0;i<state.gamePlayers.length;i++){
      r -= state.weights[i];
      if(r<=0){ state.weights[i]*=0.05; return state.gamePlayers[i]; }
    }
    return state.gamePlayers[state.gamePlayers.length-1];
  }

  function rerollPlayer() {
    if(state.rerollsLeft<=0||!state.currentDrawn) return;
    const available = state.gamePlayers.filter(p => !(p.name===state.currentDrawn.name&&p.number===state.currentDrawn.number));
    if(available.length===0) return;
    const totalW = available.reduce((a,p)=>a+state.weights[state.gamePlayers.indexOf(p)],0);
    let r = Math.random()*totalW;
    for(let p of available){
      r -= state.weights[state.gamePlayers.indexOf(p)];
      if(r<=0){ state.currentDrawn=p; break; }
    }
    if(!state.currentDrawn) state.currentDrawn=available[available.length-1];
    state.rerollsLeft--;
    updateUI();
  }

  function calcOverall() {
    const w = {three:0.15,mid:0.12,reb:0.12,ast:0.15,str:0.10,stl:0.12,blk:0.08,drib:0.16};
    let s=0; for(let k in state.builtAttrs) s+=state.builtAttrs[k].value*(w[k]||0.1);
    return Math.round(s);
  }

  function getGrade(val) {
    if(val>=90) return {grade:'S',desc:'超级巨星',color:'#ff3b3b'};
    if(val>=80) return {grade:'A',desc:'全明星',color:'#ff7b3b'};
    if(val>=60) return {grade:'B',desc:'角色球员',color:'#f0a020'};
    return {grade:'C',desc:'饮水机球员',color:'#5b9bd5'};
  }

  function getDraftPick(overall) {
    if(overall>=95) return '🏅 状元签';
    if(overall>=90) return '首轮第'+(1+Math.floor(Math.random()*3))+'顺位';
    if(overall>=85) return '首轮第'+(4+Math.floor(Math.random()*5))+'顺位';
    if(overall>=80) return '首轮第'+(9+Math.floor(Math.random()*6))+'顺位';
    if(overall>=75) return '首轮第'+(15+Math.floor(Math.random()*10))+'顺位';
    if(overall>=70) return '次轮第'+(1+Math.floor(Math.random()*10))+'顺位';
    if(overall>=65) return '次轮第'+(11+Math.floor(Math.random()*15))+'顺位';
    return '落选秀';
  }

  function generateHonors(overall) {
    const honors = [];
    if(overall>=95) honors.push('🏆 总冠军 (3次)','🏅 常规赛MVP (2次)','🏅 总决赛MVP (2次)','⭐ 全明星 (8次)','📊 最佳阵容一阵 (5次)','🛡️ 最佳防守阵容 (2次)');
    else if(overall>=90) honors.push('🏆 总冠军 (1次)','🏅 常规赛MVP (1次)','⭐ 全明星 (6次)','📊 最佳阵容一阵 (2次)','📊 最佳阵容二阵 (2次)');
    else if(overall>=85) honors.push('⭐ 全明星 (4次)','📊 最佳阵容二阵 (2次)','📊 最佳阵容三阵 (1次)','🛡️ 最佳防守阵容 (1次)');
    else if(overall>=80) honors.push('⭐ 全明星 (2次)','📊 最佳阵容三阵 (1次)','🏀 最佳第六人 (1次)');
    else if(overall>=75) honors.push('⭐ 全明星 (1次)','📋 周最佳球员 (3次)','🏀 进步最快球员 (1次)');
    else if(overall>=70) honors.push('📋 周最佳球员 (1次)','🔄 稳定轮换球员');
    else if(overall>=65) honors.push('🔄 角色球员','📋 双向合同');
    else honors.push('🔄 辗转多队','📋 短合同球员');
    if(overall>=80&&Math.random()>0.6) honors.push('🎯 三分大赛冠军');
    if(overall>=75&&Math.random()>0.7) honors.push('🏅 扣篮大赛冠军');
    if(Math.random()>0.85) honors.push('🌟 最佳队友奖');
    return honors;
  }

  function calcCareerStats() {
    const a = state.builtAttrs;
    const pts = Math.round((a.mid.value*0.35 + a.three.value*0.25 + a.drib.value*0.15 + a.stl.value*0.1 + a.reb.value*0.1 + a.ast.value*0.05) / 5.5);
    const reb = Math.round((a.reb.value*0.6 + a.str.value*0.3 + a.blk.value*0.1) / 6.5);
    const ast = Math.round((a.ast.value*0.55 + a.drib.value*0.35 + a.stl.value*0.1) / 6);
    const stl = +(a.stl.value / 45).toFixed(1);
    const blk = +(a.blk.value / 45).toFixed(1);
    return { pts:Math.max(2,Math.min(35,pts)), reb:Math.max(1,Math.min(15,reb)), ast:Math.max(0.5,Math.min(12,ast)), stl, blk };
  }

  function matchNBAComp(stats, pos) {
    let best = null, bestScore = -1;
    for (let comp of NBA_COMPS) {
      if (!comp.pos.includes(pos)) continue;
      let score = 0;
      if (comp.min.pts && stats.pts>=comp.min.pts && stats.pts<=(comp.max.pts||99)) score++;
      if (comp.min.reb && stats.reb>=comp.min.reb && stats.reb<=(comp.max.reb||99)) score++;
      if (comp.min.ast && stats.ast>=comp.min.ast && stats.ast<=(comp.max.ast||99)) score++;
      if (comp.min.stl && stats.stl>=comp.min.stl && stats.stl<=(comp.max.stl||99)) score++;
      if (comp.min.blk && stats.blk>=comp.min.blk && stats.blk<=(comp.max.blk||99)) score++;
      if (comp.min.three && state.builtAttrs.three.value>=comp.min.three && state.builtAttrs.three.value<=(comp.max.three||99)) score++;
      if (comp.min.mid && state.builtAttrs.mid.value>=comp.min.mid && state.builtAttrs.mid.value<=(comp.max.mid||99)) score++;
      if (comp.min.drib && state.builtAttrs.drib.value>=comp.min.drib && state.builtAttrs.drib.value<=(comp.max.drib||99)) score++;
      if (score > bestScore) { bestScore = score; best = comp; }
    }
    return best || NBA_COMPS[0];
  }

  function encodePlayerData() {
    const data = {
      pos: state.pos,
      score: calcOverall(),
      attrs: {},
      sources: {}
    };
    ATTR_KEYS.forEach(k => {
      data.attrs[k] = state.builtAttrs[k].value;
      data.sources[k] = { name: state.builtAttrs[k].sourceName, num: state.builtAttrs[k].sourceNumber };
    });
    return btoa(encodeURIComponent(JSON.stringify(data)));
  }

  function decodePlayerData(str) {
    try { return JSON.parse(decodeURIComponent(atob(str))); }
    catch(e) { return null; }
  }

  function getShareLink() {
    const code = encodePlayerData();
    const base = window.location.href.split('?')[0];
    return base + '?opponent=' + code;
  }

  function parseURLParams() {
    const url = new URL(window.location.href);
    const opp = url.searchParams.get('opponent');
    if (opp) {
      opponentData = decodePlayerData(opp);
      if (opponentData) {
        gameMode = 'versus';
        document.getElementById('vsOpponentInfo').hidden = false;
        document.getElementById('vsOpponentInfo').textContent = '⚡ 已检测到好友挑战！对手评分：' + opponentData.score + ' | 位置：' + (POS_LABELS[opponentData.pos]||opponentData.pos);
        document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
        document.querySelector('[data-mode="versus"]').classList.add('selected');
        document.getElementById('btnEnterGame').textContent = '接受挑战 · 开始游戏';
      }
    }
  }

  function updateUI() {
    document.getElementById('progressText').textContent = state.finished ? '✅ 抽取完成！' : `第 ${state.round+1}/8 轮`;
    document.getElementById('rerollCount').textContent = state.rerollsLeft;
    document.getElementById('rerollBtnCount').textContent = state.rerollsLeft;
    let chipsHtml='';
    ATTR_KEYS.forEach((k,i)=>{
      const d=state.builtAttrs[k];
      chipsHtml+=d?`<span class="chip filled">${ATTR_NAMES[i]}:${d.value}</span>`:`<span class="chip">${ATTR_NAMES[i]}:?</span>`;
    });
    document.getElementById('builtChips').innerHTML=chipsHtml;
    const drawBtn = document.getElementById('drawBtn');
    const rerollBtn = document.getElementById('rerollBtn');
    if(state.finished){
      document.getElementById('currentJersey').textContent='🏆';
      document.getElementById('currentName').textContent='抽取完成';
      document.getElementById('currentPos').textContent='--';
      document.getElementById('attrGrid').innerHTML='';
      drawBtn.textContent='已完成'; drawBtn.disabled=true;
      rerollBtn.style.display='none';
    } else if(state.currentDrawn){
      const p=state.currentDrawn;
      document.getElementById('currentJersey').textContent=p.number;
      document.getElementById('currentName').textContent=p.name;
      document.getElementById('currentPos').textContent=p.pos;
      let gridHtml='';
      ATTR_KEYS.forEach((k,i)=>{
        const v=p._attrs[k];
        const picked=state.builtAttrs.hasOwnProperty(k);
        gridHtml+=`<div class="attr-cell ${picked?'picked':''}" data-key="${k}"><div class="al">${ATTR_NAMES[i]}</div><div class="av">${v}</div></div>`;
      });
      document.getElementById('attrGrid').innerHTML=gridHtml;
      document.querySelectorAll('.attr-cell:not(.picked)').forEach(c=>c.addEventListener('click',()=>pickAttr(c.dataset.key)));
      drawBtn.textContent='👆 选择属性'; drawBtn.disabled=true;
      rerollBtn.style.display='block'; rerollBtn.disabled=state.rerollsLeft<=0;
    } else {
      document.getElementById('currentJersey').textContent='??';
      document.getElementById('currentName').textContent='等待抽取';
      document.getElementById('currentPos').textContent='--';
      document.getElementById('attrGrid').innerHTML='';
      drawBtn.textContent='🎲 随机抽取球员'; drawBtn.disabled=false;
      rerollBtn.style.display='none';
    }
  }

  function pickAttr(key){
    if(!state.currentDrawn||state.builtAttrs[key]||!state.remainingKeys.includes(key)) return;
    state.builtAttrs[key]={value:state.currentDrawn._attrs[key],sourceName:state.currentDrawn.name,sourceNumber:state.currentDrawn.number};
    state.remainingKeys=state.remainingKeys.filter(k=>k!==key);
    state.round++; state.currentDrawn=null;
    if(state.remainingKeys.length===0){ state.finished=true; updateUI(); setTimeout(showRating,500); }
    else updateUI();
  }

  function showRating(){
    const overall=calcOverall();
    const {grade,desc,color}=getGrade(overall);
    document.getElementById('ratingPosEn').textContent=state.pos;
    document.getElementById('ratingPosCn').textContent=POS_LABELS[state.pos]||'';
    document.getElementById('ratingScore').textContent=overall;
    document.getElementById('ratingScore').style.color=color;
    document.getElementById('ratingGrade').textContent=grade+'级 · '+desc;
    document.getElementById('ratingGrade').style.background=color;
    document.getElementById('ratingGrade').style.color='#fff';
    let sourceHtml='';
    ATTR_KEYS.forEach((k,i)=>{
      const d=state.builtAttrs[k];
      sourceHtml+=`<div class="attr-source-item"><span>${ATTR_NAMES[i]}</span><span>${d.value} — 来自 #${d.sourceNumber} ${d.sourceName}</span></div>`;
    });
    document.getElementById('ratingAttrSources').innerHTML=sourceHtml;
    if (gameMode === 'versus') {
      document.getElementById('btnDraft').style.display = 'none';
      document.getElementById('btnShareInvite').style.display = 'none';
    } else {
      document.getElementById('btnDraft').style.display = 'block';
      document.getElementById('btnShareInvite').style.display = 'block';
    }
    document.getElementById('ratingOverlay').classList.add('show');
    spawnParticles();
  }

  function showCareer(){
    document.getElementById('ratingOverlay').classList.remove('show');
    const overall=calcOverall();
    const {grade,desc,color}=getGrade(overall);
    const teamStr=NBA_TEAMS[Math.floor(Math.random()*NBA_TEAMS.length)];
    const pick=getDraftPick(overall);
    const honors=generateHonors(overall);
    const stats=calcCareerStats();
    const comp=matchNBAComp(stats, state.pos);
    const imgStart=teamStr.indexOf('<img');
    const teamName=teamStr.substring(0,imgStart);
    const imgTag=teamStr.substring(imgStart);
    document.getElementById('teamLogo').innerHTML=imgTag;
    document.getElementById('teamName').textContent=teamName;
    document.getElementById('draftPick').textContent=pick;
    document.getElementById('careerStats').innerHTML = `
      <div class="career-stat"><div class="cs-val">${stats.pts}</div><div class="cs-label">得分</div></div>
      <div class="career-stat"><div class="cs-val">${stats.reb}</div><div class="cs-label">篮板</div></div>
      <div class="career-stat"><div class="cs-val">${stats.ast}</div><div class="cs-label">助攻</div></div>
      <div class="career-stat"><div class="cs-val">${stats.stl}</div><div class="cs-label">抢断</div></div>
      <div class="career-stat"><div class="cs-val">${stats.blk}</div><div class="cs-label">盖帽</div></div>
    `;
    document.getElementById('nbaComp').innerHTML = `📋 NBA模板：<strong>${comp.name}</strong> · ${comp.traits}`;
    let honorHtml='<div class="honor-title">🏅 生涯荣誉</div>';
    honors.forEach(h=>{ honorHtml+=`<div class="honor-item">${h}</div>`; });
    document.getElementById('honorList').innerHTML=honorHtml;
    document.getElementById('careerOverlay').classList.add('show');
    spawnParticles();
  }

  function showVersusResult() {
    const myScore = calcOverall();
    const oppScore = opponentData.score;
    const myGrade = getGrade(myScore);
    const oppGrade = getGrade(oppScore);
    document.getElementById('vsName1').textContent = '好友';
    document.getElementById('vsScore1').textContent = oppScore;
    document.getElementById('vsScore1').style.color = oppGrade.color;
    document.getElementById('vsPos1').textContent = (POS_LABELS[opponentData.pos]||opponentData.pos);
    document.getElementById('vsName2').textContent = '你';
    document.getElementById('vsScore2').textContent = myScore;
    document.getElementById('vsScore2').style.color = myGrade.color;
    document.getElementById('vsPos2').textContent = POS_LABELS[state.pos]||state.pos;
    if (myScore > oppScore) {
      document.getElementById('vsWinner').textContent = '🏆 你 获胜！';
      document.getElementById('vsWinner').style.background = '#ffe0e0';
    } else if (myScore < oppScore) {
      document.getElementById('vsWinner').textContent = '🏆 好友 获胜！';
      document.getElementById('vsWinner').style.background = '#e0e0ff';
    } else {
      document.getElementById('vsWinner').textContent = '🤝 平局！';
      document.getElementById('vsWinner').style.background = '#f0f0f0';
    }
    let compareHtml = '';
    ATTR_KEYS.forEach((k,i) => {
      compareHtml += `${ATTR_NAMES[i]}: 好友${opponentData.attrs[k]} vs 你${state.builtAttrs[k].value} | `;
    });
    document.getElementById('vsAttrCompare').textContent = compareHtml;
    document.getElementById('versusOverlay').classList.add('show');
    spawnParticles();
  }

  function spawnParticles(){
    const container=document.getElementById('particlesContainer');
    for(let i=0;i<25;i++){
      const p=document.createElement('div'); p.className='particle';
      p.style.left='50%'; p.style.top='50%';
      p.style.setProperty('--x',(Math.random()-0.5)*250+'px');
      p.style.setProperty('--y',(Math.random()-0.5)*250+'px');
      p.style.background=['#ff5e3a','#ffd93d','#ff3b3b','#ff9a3c','#3b8beb'][Math.floor(Math.random()*5)];
      p.style.width=(4+Math.random()*10)+'px'; p.style.height=p.style.width;
      p.style.animationDuration=(0.6+Math.random()*1.2)+'s';
      container.appendChild(p); setTimeout(()=>p.remove(),1500);
    }
  }

  function resetGame(){
    document.getElementById('careerOverlay').classList.remove('show');
    document.getElementById('ratingOverlay').classList.remove('show');
    document.getElementById('versusOverlay').classList.remove('show');
    document.getElementById('gamePage').classList.remove('active');
    document.getElementById('posPage').classList.remove('active');
    document.getElementById('modePage').classList.add('active');
    document.getElementById('confirmPosBtn').disabled=true;
    document.querySelectorAll('.pos-btn').forEach(b=>b.classList.remove('selected'));
    state.pos=null;
    opponentData=null;
    gameMode='solo';
    document.getElementById('vsOpponentInfo').hidden=true;
    document.getElementById('btnEnterGame').textContent='进入游戏';
    document.querySelectorAll('.mode-card').forEach(c=>c.classList.remove('selected'));
    document.querySelector('[data-mode="solo"]').classList.add('selected');
    window.history.replaceState({}, '', window.location.href.split('?')[0]);
  }

  function enterGame(){
    if (gameMode === 'versus' && opponentData) {
      document.getElementById('opponentBar').hidden = false;
      document.getElementById('opponentBar').textContent = '⚡ 好友评分：' + opponentData.score + ' | 位置：' + (POS_LABELS[opponentData.pos]||opponentData.pos);
    } else {
      document.getElementById('opponentBar').hidden = true;
    }
    document.getElementById('modePage').classList.remove('active');
    document.getElementById('posPage').classList.add('active');
  }

  function shareInvite(){
    const link = getShareLink();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(link).then(() => {
        alert('链接已复制！发送给好友即可对战。\n\n' + link);
      });
    } else {
      const input = document.createElement('textarea');
      input.value = link;
      input.style.position = 'fixed';
      input.style.left = '-9999px';
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);
      alert('链接已复制！发送给好友即可对战。\n\n' + link);
    }
  }

  function showRatingOrVersus(){
    if (gameMode === 'versus' && opponentData) {
      showVersusResult();
    } else {
      showRating();
    }
  }

  document.querySelectorAll('.mode-card').forEach(card => {
    card.addEventListener('click', function(){
      document.querySelectorAll('.mode-card').forEach(c=>c.classList.remove('selected'));
      this.classList.add('selected');
      gameMode = this.dataset.mode;
    });
  });

  document.getElementById('btnEnterGame').addEventListener('click', enterGame);
  document.querySelectorAll('.pos-btn').forEach(btn=>{
    btn.addEventListener('click',function(){
      document.querySelectorAll('.pos-btn').forEach(b=>b.classList.remove('selected'));
      this.classList.add('selected');
      state.pos=this.dataset.pos;
      document.getElementById('confirmPosBtn').disabled=false;
    });
  });

  document.getElementById('confirmPosBtn').addEventListener('click',()=>{
    if(!state.pos) return;
    initGame();
    document.getElementById('posPage').classList.remove('active');
    document.getElementById('gamePage').classList.add('active');
    updateUI();
  });

  document.getElementById('drawBtn').addEventListener('click',()=>{
    if(state.finished||state.currentDrawn) return;
    state.currentDrawn=drawPlayer();
    updateUI();
  });

  document.getElementById('rerollBtn').addEventListener('click',rerollPlayer);
